# CI — build + test on every push to main and every pull request.
#
# this file is a thin bootstrap. All real logic lives in
# scripts/ and the Makefile, so `make ci` on a laptop runs the same steps.
#
# Linux jobs build musl static (-Dffi=false), matching the release assets
# and the Docker image. Native glibc builds are dropped from CI: fetch
# hangs on the ubuntu-latest/Azure kernel (see README "Known issues").
name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

# One CI run per ref; a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: zig fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - run: zig fmt --check build.zig src/

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux default backend is io_uring; epoll stays as fallback.
          # musl static: glibc fetch hangs on ubuntu-latest (Azure kernel),
          # so glibc is out of CI until that is root-caused. FFI is off on
          # musl (no system libffi); test/ffi.test.js self-skips, and macOS
          # still covers FFI fully.
          - name: linux-musl-io_uring
            os: ubuntu-latest
            build: "-Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dffi=false"
            test: "-Dtarget=x86_64-linux-musl -Dffi=false"
          - name: linux-musl-epoll
            os: ubuntu-latest
            build: "-Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dffi=false -Dio_uring=false"
            test: "-Dtarget=x86_64-linux-musl -Dffi=false -Dio_uring=false"
          # macOS backend is kqueue (native build, FFI enabled).
          - name: macos
            os: macos-latest
            build: "-Doptimize=ReleaseFast"
            test: ""
          # ReleaseSafe runs the SAME suite with safety checks on: several
          # parsers fail silently in ReleaseFast but panic here.
          - name: linux-musl-release-safe
            os: ubuntu-latest
            build: "-Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false"
            test: "-Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-zig-${{ hashFiles('build.zig.zon') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}

      - name: Fetch C vendors
        run: sh scripts/fetch-vendors.sh

      - name: Build
        run: zig build ${{ matrix.build }}

      - name: Zig unit tests
        run: zig build test ${{ matrix.test }}

      - name: JS smoke tests
        run: sh test/fixtures/build.sh && sh test/run.sh

  fuzz-smoke:
    name: fuzz smoke (ReleaseSafe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-fuzz-zig-${{ hashFiles('build.zig.zon') }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-fuzz-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}

      - name: Fetch C vendors
        run: sh scripts/fetch-vendors.sh

      - name: Fuzz smoke
        run: zig build fuzz -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false -- smoke

      - name: Canary must fail
        run: |
          if zig build fuzz -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false -- canary 1; then
            echo "canary unexpectedly passed — fuzzer failures are not propagating"
            exit 1
          fi

  coverage:
    name: coverage (kcov, informational)
    # kcov is not packaged for Ubuntu 24.04 (noble); jammy ships kcov 38.
    # ubuntu-latest resolves to 24.04 → "Unable to locate package kcov".
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-cov-zig-${{ hashFiles('build.zig.zon') }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-cov-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}

      - name: Fetch C vendors
        run: sh scripts/fetch-vendors.sh

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Coverage of unit tests
        run: |
          rm -rf kcov-output
          zig build test:build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false
          kcov --include-path=./src kcov-output ./zig-out/bin/ff-test

      - name: Coverage of fuzzers
        run: |
          zig build fuzz:build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dffi=false
          kcov --include-path=./src kcov-output ./zig-out/bin/fuzz smoke
          for s in 123 124 125 126 127; do
            for t in ws_frame http_request semver tls_pem utf8 http2_stream; do
              kcov --include-path=./src kcov-output ./zig-out/bin/fuzz "$t" "$s" --events-max=200000
            done
          done
          kcov --include-path=./src kcov-output ./zig-out/bin/fuzz ws_frame 0123456789abcdef0123456789abcdef01234567 --events-max=1000
          kcov --include-path=./src kcov-output ./zig-out/bin/fuzz || true
          kcov --include-path=./src kcov-output ./zig-out/bin/fuzz bogus || true
          kcov --include-path=./src kcov-output ./zig-out/bin/fuzz canary 1 || true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kcov-report
          path: kcov-output

  postgres:
    name: postgres integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fairyfly
          POSTGRES_PASSWORD: fairyfly
          POSTGRES_DB: fairyfly
        ports:
          - 5432:5432
        # Same readiness gate as docker-compose.yml.
        options: >-
          --health-cmd="pg_isready -U fairyfly"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      PG_TEST_DSN: postgres://fairyfly:fairyfly@localhost:5432/fairyfly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-musl-zig-${{ hashFiles('build.zig.zon') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-musl-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}

      - run: sh scripts/fetch-vendors.sh
      - run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dffi=false
      - run: sh test/fixtures/build.sh && sh test/run.sh

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t fairyfly:ci .
