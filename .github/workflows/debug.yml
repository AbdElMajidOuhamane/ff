
name: Debug hang
permissions: {}
on:
  workflow_dispatch:
  push:
    branches: [fairyfly-canary]
concurrency:
  group: debug-hang
  cancel-in-progress: true
jobs:
  glibc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libffi-dev strace
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('build.zig.zon') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}
      - run: sh scripts/fetch-vendors.sh
      - run: zig build -Doptimize=ReleaseFast
      - name: Environment
        run: |
          uname -r
          cat /proc/sys/kernel/io_uring_disabled || true
          env | grep -i -E "proxy|http" | sort || true
      - name: Network control (curl)
        run: |
          echo "curl neverssl: $(curl -sS -m 10 -o /dev/null -w '%{http_code}' http://neverssl.com/ || echo FAIL)"
      - name: External fetch probe (60s cap)
        run: |
          cat > ext-probe.mjs <<'EOF'
          import "./test/lib.mjs";
          fetch("http://neverssl.com/")
            .then(async (r) => console.log("EXT", r.status))
            .catch((e) => console.log("EXT-ERR", String(e)));
          EOF
          timeout 60 ./zig-out/bin/ff ext-probe.mjs || echo "exit=$?"
      - name: Snapshot strace of hanging http.test.js
        run: |
          ./zig-out/bin/ff test/http.test.js --allow-ffi &
          PID=$!
          sleep 25
          if ! kill -0 $PID 2>/dev/null; then
            echo "RESULT: http.test.js already exited (no hang on this runner)"
          else
            timeout 6 strace -f -tt -p $PID -o /tmp/snap.log || true
            echo "RESULT: still running at t=25s — strace snapshot follows:"
            tail -100 /tmp/snap.log
          fi
          kill -9 $PID 2>/dev/null || true
  musl-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('build.zig.zon') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-vendors-${{ hashFiles('scripts/fetch-vendors.sh') }}
      - run: sh scripts/fetch-vendors.sh
      - name: Build musl static (Docker-equivalent)
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dffi=false
      - name: Run http.test.js (60s cap)
        run: timeout 60 ./zig-out/bin/ff test/http.test.js --allow-ffi || echo "exit=$?"
